# Render Static Site config
# Required so deep links like /support, /deposit, /admin etc. don't return 404
# (which the browser sometimes saves as a .txt file). Every request that does
# not match a real file is rewritten to /index.html so React-Router can handle it.
services:
  - type: web
    name: adx-dubai-frontend
    env: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_LIVE_SUPPORT_URL
        fromService:
          type: web
          name: adx-live-support
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

  # Live support (separate free web service). After deploy, put its URL into
  # the frontend env as REACT_APP_LIVE_SUPPORT_URL.
  - type: web
    name: adx-live-support
    runtime: node
    plan: free
    rootDir: live-support
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPERATOR_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
